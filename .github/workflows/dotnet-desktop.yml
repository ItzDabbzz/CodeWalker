name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Strip leading 'v' from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Restore NuGet packages
        run: nuget restore CodeWalker.sln

      - name: Build Release
        run: msbuild CodeWalker.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # Copy binaries/configs from .NET Framework output
          find . -path '*/bin/Release/net48/*' \
            -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.config' \) \
            -exec cp {} artifacts/ \;
          # If net48 folder doesn't exist, try the general Release folder
          if [ ! "$(ls -A artifacts/*.exe 2>/dev/null)" ]; then
            find . -path '*/bin/Release/*' \
              -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.config' \) \
              -not -path '*/ref/*' \
              -exec cp {} artifacts/ \;
          fi
          # Copy documentation files
          cp README.md artifacts/
          cp Readme_Src.txt artifacts/
          cp Notice.txt artifacts/
          # Create & copy icons folder
          mkdir -p artifacts/icons
          cp -r icons/* artifacts/icons/ 2>/dev/null || true
          # Create & copy Shaders folder
          mkdir -p artifacts/Shaders
          cp -r Shaders/* artifacts/Shaders/ 2>/dev/null || true

      - name: Remove PDB files
        shell: bash
        run: rm -f artifacts/*.pdb

      - name: List artifacts (debug)
        shell: bash
        run: |
          echo "Artifacts collected:"
          ls -la artifacts/

      - name: Archive artifacts
        shell: pwsh
        run: Compress-Archive -Path artifacts\* -DestinationPath release.zip

      - name: Get Release Draft
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const draftRelease = releases.data.find(release =>
              release.draft && release.tag_name === context.ref.replace('refs/tags/', '')
            );

            if (draftRelease) {
              await core.summary.addRaw(`Found draft release: ${draftRelease.name}`).write();

              const fs = require('fs');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_id=${draftRelease.id}\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_body=${draftRelease.body.replace(/\n/g, '%0A')}\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_name=${draftRelease.name}\n`);

              return draftRelease.id;
            } else {
              await core.summary.addRaw('No draft release found, will create new release').write();

              const fs = require('fs');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_id=\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_body=\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_name=\n`);

              return '';
            }

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release.zip
          name: ${{ steps.get_release.outputs.release_name || format('CodeWalker-Dabz-v{0}', env.VERSION) }}
          body: ${{ steps.get_release.outputs.release_body || 'Release build' }}
          draft: false
          prerelease: false
