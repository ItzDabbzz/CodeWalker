name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
          
      - name: Strip leading 'v' from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Restore packages for win-x64
        run: dotnet restore CodeWalker.sln --runtime win-x64

      - name: Build Release
        shell: cmd
        run: msbuild CodeWalker.sln /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /m

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # Copy binaries/configs
          find . -path '*/bin/Release/net48/*' \
            -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.config' \) \
            -exec cp {} artifacts/ \;
          # Copy documentation files
          cp README.md artifacts/
          cp Readme_Src.txt artifacts/
          cp Notice.txt artifacts/
          # Create & copy icons folder
          mkdir -p artifacts/icons
          cp -r icons/* artifacts/icons/
          # Create & copy Shaders folder
          mkdir -p artifacts/Shaders
          cp -r Shaders/* artifacts/Shaders/

      - name: Remove PDB files
        shell: bash
        run: rm -f artifacts/*.pdb

      - name: Archive artifacts
        shell: pwsh
        run: Compress-Archive -Path artifacts\* -DestinationPath release.zip

      - name: Get Release Draft
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const draftRelease = releases.data.find(release => 
              release.draft && release.tag_name === context.ref.replace('refs/tags/', '')
            );
            
            if (draftRelease) {
              core.setOutput('release_id', draftRelease.id);
              core.setOutput('release_body', draftRelease.body);
              core.setOutput('release_name', draftRelease.name);
              return draftRelease.id;
            } else {
              core.setOutput('release_id', '');
              core.setOutput('release_body', '');
              core.setOutput('release_name', '');
              return '';
            }

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release.zip
          name: ${{ steps.get_release.outputs.release_name || format('CodeWalker-Dabz-v{0}', env.VERSION) }}
          body: ${{ steps.get_release.outputs.release_body || 'Release build' }}
          draft: false
          prerelease: false